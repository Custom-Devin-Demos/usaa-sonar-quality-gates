name: CI

on:
  push:
    branches: [ master ]
    tags: [ '*' ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build
        run: ./gradlew build jacocoTestReport

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build
    env:
      SONARQUBE_VERSION: "7.9-community"
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build
        run: ./gradlew build

      - name: Start SonarQube
        run: docker run -d -p 9000:9000 --name sonarqube sonarqube:$SONARQUBE_VERSION

      - name: Wait for SonarQube to start
        run: |
          for i in $(seq 1 300); do
            sleep 1
            if docker logs sonarqube 2>&1 | grep -q "SonarQube is up"; then
              echo "SonarQube is up"
              exit 0
            fi
          done
          echo "SonarQube failed to start"
          exit 1

      - name: Create admin token
        id: token
        run: |
          JSON=$(curl -s -X POST -u "admin:admin" "http://localhost:9000/api/user_tokens/generate?name=token")
          TOKEN=$(echo "$JSON" | python3 -c "import sys, json; print(json.loads(sys.stdin.read())['token'])")
          echo "SONAR_TOKEN=$TOKEN" >> $GITHUB_ENV

      - name: Create quality gate
        run: |
          curl -s -X POST -u "$SONAR_TOKEN:" 'http://localhost:9000/api/qualitygates/copy?id=1&name=test-gate'

      - name: Run passing quality gate test
        working-directory: test-project
        run: |
          unset SONARQUBE_SCANNER_PARAMS
          unset SONARQUBE_SKIPPED
          ./gradlew applyQualityGate sonarqube verifySonarqubeQualityGates -Dsonar.host.url=http://localhost:9000 -Dsonar.login=$SONAR_TOKEN

      - name: Add strict gate condition
        run: |
          curl -s -X POST -u "$SONAR_TOKEN:" 'http://localhost:9000/api/qualitygates/create_condition?gateId=2&metric=vulnerabilities&op=GT&error=0'

      - name: Run failing quality gate test (expected failure)
        working-directory: test-project
        run: |
          ! ./gradlew applyQualityGate sonarqube verifySonarqubeQualityGates -Dsonar.host.url=http://localhost:9000 -Dsonar.login=$SONAR_TOKEN

  deploy:
    name: Publish Plugin
    runs-on: ubuntu-latest
    needs: [ build, integration-test ]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Publish Plugin
        run: ./gradlew publishPlugins -Dgradle.publish.key=${{ secrets.PUBLISH_KEY }} -Dgradle.publish.secret=${{ secrets.PUBLISH_SECRET }}
